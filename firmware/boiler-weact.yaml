# ============================================================================
#  Прошивка ESPHome: WeAct Studio ESP32-D0WD-V3  ↔  Drazice OKHE 125 SMART
# ============================================================================
#  Призначення: читати стан бойлера по BLE та віддавати його у локальну мережу
#  по HTTP REST (без MQTT, без обов'язкового Home Assistant). Керування
#  проходить ЛИШЕ через локальний arbiter boiler_guard (guarded template
#  entities), який забезпечує cooldown / lease / readback.
#
#  ПЕРЕД ЗБІРКОЮ:
#    1. Скопіюйте secrets.example.yaml -> secrets.yaml і заповніть.
#    2. Переконайтесь у версії ESPHome з requirements-build.lock.
#    3. `esphome config firmware/boiler-weact.yaml`  (валідація)
#       `esphome compile firmware/boiler-weact.yaml` (збірка)
#
#  УВАГА: board/flash/pinout підтвердити на реальній платі (flash_id, USB VID/PID).
#  8 MB Flash з етикетки НЕ доводить PSRAM — PSRAM не вмикаємо без доказу.
# ============================================================================

substitutions:
  device_name: "drazice-boiler"
  friendly_name: "Drazice Boiler"
  # Параметри безпеки локального guard (детермінована політика ESP32).
  # Значення — ТЕСТОВІ дефолти, не сертифікована норма. Погодьте під свій монтаж.
  max_continuous_heat_s: "3600"   # макс. тривалий фактичний нагрів (с)
  min_pause_s: "600"              # обов'язкова пауза (cooldown) після ліміту (с)
  heat_false_debounce_s: "30"     # скільки Heat=false має протриматись, щоб зарахувати паузу
  lease_ttl_s: "180"              # дозвіл від MajorDoMo діє стільки (с); не поновили — забороняємо нові пуски
  command_timeout_s: "20"         # час на readback підтвердження команди
  # Світлодіод статусу (економний heartbeat). Підтвердіть пін LED вашої плати.
  status_led_pin: "GPIO2"         # вбудований LED (на багатьох ESP32 це GPIO2)
  status_led_inverted: "false"    # true, якщо LED світиться при LOW

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # Безпечний старт: без агресивного нагріву, доки немає lease.
  on_boot:
    priority: 600
    then:
      - lambda: 'id(boiler_guard_component).on_safe_boot();'
      # Реєструємо неблокуючий LED-пульс на кожен HTTP-запит. Хук викликається
      # з rest_api-компонента (перша дія обробки кожного прийнятого запиту) і
      # лише вмикає status_led_out та планує його вимкнення через ~50 мс (без
      # heap-алокацій, без блокування).
      - lambda: |-
          esphome::rest_api::set_web_activity_led_hook([]() {
            id(status_led_out)->turn_on();
            App.scheduler.set_timeout((Component *) nullptr, "web_led", 50, []() {
              id(status_led_out)->turn_off();
            });
          });

# Classic ESP32 (D0WD-V3), Arduino framework. НЕ C3/S3.
# Фіксуємо 8 MB flash (flash_size). Якщо flash_id покаже інший розмір —
# ВИПРАВИТИ тут і зібрати заново. 8 MB з етикетки НЕ доводить PSRAM.
esp32:
  board: esp32dev
  # Плата WeAct має 8 MB flash (підтвердьте flash_id = 8 MiB перед записом).
  # Дефолтна 4 MB-таблиця дає app-розділ ~1.79 MB, а наш образ ~1.87 MB у нього
  # НЕ вміщується. Тому задаємо 8 MB flash і власну таблицю (2×OTA по 3 MB).
  flash_size: 8MB
  partitions: partitions.csv
  framework:
    type: arduino

# ---- Локальні компоненти ----------------------------------------------------
# smartboiler вендорено в цьому репо (автор upstream LubosD дав дозвіл на
# використання коду). Джерело і атрибуція — firmware/components/smartboiler/
# та THIRD_PARTY_NOTICES.md. boiler_guard — наш власний.
external_components:
  - source:
      type: local
      path: components
    # rest_api — власний легкий HTTP REST-сервер (синхронний WiFiServer, ручний
    # JSON, Basic auth), що замінив ESPHome web_server/ESPAsyncWebServer. Останній
    # вичерпував heap під Bluedroid BLE (free heap ~208 B -> "Empty reply from
    # server"). smartboiler вендорено (дозвіл upstream LubosD), boiler_guard — наш.
    components: [smartboiler, boiler_guard, rest_api]

packages:
  network:     !include packages/network.yaml
  diagnostics: !include packages/diagnostics.yaml
  smartboiler: !include packages/smartboiler.yaml
  policy:      !include packages/policy_guard.yaml
  status_led:  !include packages/status_led.yaml

# REST-інтерфейс для PHP-модуля. Транспорт машинний (GET /sensor/..,
# POST /number/../set, POST /button/../press), важка вебсторінка НЕ потрібна.
# Реалізація — власний компонент rest_api: синхронний WiFiServer/WiFiClient у
# loop(), фіксовані стекові буфери, JSON будується вручну (БЕЗ ArduinoJson, без
# per-request heap-документів). Це замінює ESPHome web_server/ESPAsyncWebServer,
# який під Bluedroid BLE вичерпував heap (free heap ~208 B -> "Empty reply from
# server") через окремий AsyncTCP-таск, per-connection буфери та ArduinoJson.
# HTTP у LAN НЕ шифрується; доступ лише з довірених вузлів. Без mDNS/discovery.
# Резолв entity — за display-name (get_name()); внутрішні (is_internal) НЕ
# віддаємо, тож guard не обійти — запис іде через ті самі guarded template
# number/select, що делегують у boiler_guard.
rest_api:
  port: 80
  auth:
    username: !secret web_username
    password: !secret web_password

# Нативний API ESPHome ВИМКНЕНО (ми не використовуємо HA/нативний транспорт).
# Якщо увімкнете для діагностики — не дозволяйте йому перезавантажувати пристрій
# за відсутності клієнта (reboot_timeout: 0s).
# api:
#   reboot_timeout: 0s

# OTA лише з паролем, лише в LAN/VPN, під наглядом, поза активним нагрівом.
ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO
  baud_rate: 115200
