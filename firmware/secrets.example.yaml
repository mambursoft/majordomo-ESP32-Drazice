# Скопіюйте цей файл у firmware/secrets.yaml і заповніть реальними значеннями.
# firmware/secrets.yaml у .gitignore — він НІКОЛИ не потрапляє в Git.

# --- Wi-Fi вашої локальної мережі ---
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# Резервна точка доступу, яку підніме ESP32, якщо не під'єднається до Wi-Fi.
# Використовуйте для первинного налаштування. Пароль — довгий і випадковий.
ap_password: "CHANGE_ME_long_random_ap_password"

# --- Bluetooth-адреса вашого бойлера ---
# Дізнатися можна лише коли бойлер НЕ під'єднаний до штатного застосунку
# (він рекламує BLE тільки без активного клієнта). Формат: AA:BB:CC:DD:EE:FF
boiler_ble_mac: "AA:BB:CC:DD:EE:FF"

# --- Доступ до вебінтерфейсу ESP32 (HTTP REST) ---
# Логін/пароль, які модуль MajorDoMo використовує для звернень до ESP32.
web_username: "boiler"
web_password: "CHANGE_ME_strong_web_password"

# --- OTA (оновлення прошивки по мережі) ---
ota_password: "CHANGE_ME_strong_ota_password"

# --- API (нативний ESPHome API; за замовчуванням вимкнено у нашій прошивці) ---
# Залиште як є, якщо не вмикаєте api у boiler-weact.yaml.
api_encryption_key: "CHANGE_ME_base64_32_byte_key_or_leave_disabled"

# --- Присутність (опційно; лише якщо підключаєте packages/presence.yaml) ------
# (A) MAC телефона підлітка (ненадійно через рандомізацію MAC на POCO/HyperOS).
presence_mac: "11:22:33:44:55:66"
# (B) Стабільний iBeacon UUID, який транслює beacon-застосунок на телефоні
#     (надійно, не залежить від рандомного MAC).
presence_ibeacon_uuid: "00000000-0000-0000-0000-000000000000"
