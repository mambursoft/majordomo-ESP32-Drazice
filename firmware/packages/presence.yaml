# ---- Присутність у туалеті (опційно) ---------------------------------------
# Необов'язковий пакет. Підключайте у boiler-weact.yaml (packages:), ЛИШЕ якщо
# справді потрібна присутність і стабільність бойлера підтверджена.
#
# ДВА способи, щоб обійти рандомізацію MAC на POCO/HyperOS:
#
#  (A) Пасивно за MAC — працює БЕЗ встановлення застосунку на телефон, але
#      НЕНАДІЙНО: сучасні телефони міняють MAC. Заповніть presence_mac у
#      secrets.yaml. Якщо телефон дає стабільний (не рандомний) MAC — спрацює.
#
#  (B) За стабільним iBeacon UUID — НАДІЙНО, але потребує, щоб на телефоні
#      працював будь-який beacon-застосунок, що транслює фіксований UUID.
#      Для відомого UUID MAC не потрібен взагалі (рандомізація не заважає).
#      Заповніть presence_ibeacon_uuid у secrets.yaml.
#
# Обидва бінарні сенсори публікуються по HTTP; модуль MajorDoMo зчитує їх і веде
# облік тривалості та виклик обробника (колонка в туалеті).
#
# ПРИМІТКА щодо стабільності: одночасне активне сканування присутності + BLE
# клієнт до бойлера навантажують BLE-стек. Якщо помітите регресії reconnect/heap
# у soak-тесті — винесіть присутність на ОКРЕМУ ESP32 (пріоритет — бойлер).

binary_sensor:
  # (A) За MAC
  - platform: ble_presence
    mac_address: !secret presence_mac
    name: "Toilet Presence By MAC"
    id: toilet_presence_mac
    timeout: 30s

  # (B) За стабільним iBeacon UUID (не залежить від рандомного MAC)
  - platform: ble_presence
    ibeacon_uuid: !secret presence_ibeacon_uuid
    name: "Toilet Presence By Beacon"
    id: toilet_presence_beacon
    timeout: 30s
