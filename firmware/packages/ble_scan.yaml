# ---- Пошук BLE-пристроїв (усуває потребу знати MAC бойлера заздалегідь) -----
# Необов'язковий діагностичний пакет. Якщо ви НЕ знаєте BLE MAC бойлера:
#   1. Зберіть окрему діагностичну прошивку, що включає лише network + ble_scan
#      (див. firmware/boiler-scan.yaml).
#   2. Переконайтесь, що штатний застосунок Drazice від'єднаний (бойлер рекламує
#      BLE лише без іншого клієнта).
#   3. Дивіться лог ESP32 (serial 115200 або web log): кожен знайдений пристрій
#      друкується з MAC і назвою. Текстовий сенсор "BLE Last Seen Device"
#      показує останній знайдений пристрій у вебінтерфейсі.
#   4. Впишіть знайдений MAC у secrets.yaml (boiler_ble_mac).
#
# Увага: цей пакет НЕ підключають одночасно з робочим ble_client до того самого
# бойлера без потреби — активне сканування + клієнт збільшують навантаження на
# BLE-стек. Для пошуку MAC використовуйте окрему прошивку boiler-scan.yaml.

text_sensor:
  - platform: template
    name: "BLE Last Seen Device"
    id: ble_last_seen
    update_interval: never

esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 320ms
    window: 300ms
  on_ble_advertise:
    then:
      - lambda: |-
          std::string name = x.get_name();
          std::string mac = x.address_str();
          // Евристика «схоже на бойлер»: ім'я містить відомі підрядки Drazice.
          std::string lname = name;
          for (auto &c : lname) c = tolower(c);
          bool looks_like_boiler =
              lname.find("okhe") != std::string::npos ||
              lname.find("drazice") != std::string::npos ||
              lname.find("dzd") != std::string::npos ||
              lname.find("smart") != std::string::npos ||
              lname.find("boiler") != std::string::npos;
          ESP_LOGI("ble_scan", "Found device: MAC=%s name='%s'%s",
                   mac.c_str(), name.c_str(),
                   looks_like_boiler ? "  <-- схоже на бойлер" : "");
          if (looks_like_boiler || !name.empty()) {
            std::string label = mac + (name.empty() ? "" : (" (" + name + ")"))
                + (looks_like_boiler ? " [boiler?]" : "");
            id(ble_last_seen).publish_state(label);
          }
