# ---- Пошук BLE-пристроїв (видно й обирається в MajorDoMo) -------------------
# Накопичує СПИСОК знайдених BLE-пристроїв у JSON і віддає його по HTTP через
# text_sensor "BLE Scan Results". Модуль MajorDoMo читає цей JSON, показує
# таблицю пристроїв (MAC, ім'я, «схоже на бойлер», RSSI) і дозволяє ОБРАТИ MAC
# одним кліком. Також є кнопка очищення списку.
#
# Використання:
#   * Для ПОШУКУ MAC зберіть окрему прошивку firmware/boiler-scan.yaml
#     (лише network + ble_scan, без робочого ble_client).
#   * Переконайтесь, що штатний застосунок Drazice від'єднаний (бойлер
#     рекламує BLE лише без іншого активного клієнта).
#   * У модулі MajorDoMo, вкладка «Пристрої» -> «Сканувати бойлери по BLE».
#
# JSON-формат: [{"mac":"aa:bb:..","name":"OKHE","boiler":true,"rssi":-62}, ...]

globals:
  - id: ble_scan_json
    type: std::string
    restore_value: no
    initial_value: '"[]"'

text_sensor:
  - platform: template
    name: "BLE Scan Results"
    id: ble_scan_results
    update_interval: 5s
    lambda: 'return id(ble_scan_json);'
  - platform: template
    name: "BLE Last Seen Device"
    id: ble_last_seen
    update_interval: never

button:
  - platform: template
    name: "BLE Scan Clear"
    id: ble_scan_clear
    on_press:
      - lambda: 'id(ble_scan_json) = "[]";'

esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 320ms
    window: 300ms
  on_ble_advertise:
    then:
      - lambda: |-
          std::string name = x.get_name();
          std::string mac = x.address_str();
          int rssi = x.get_rssi();

          // Евристика «схоже на бойлер» за назвою Drazice / SMART.
          std::string lname = name;
          for (size_t i = 0; i < lname.size(); i++) lname[i] = tolower(lname[i]);
          bool looks_like_boiler =
              lname.find("okhe") != std::string::npos ||
              lname.find("drazice") != std::string::npos ||
              lname.find("dzd") != std::string::npos ||
              lname.find("smart") != std::string::npos ||
              lname.find("boiler") != std::string::npos;

          // Ігноруємо пристрої без назви, якщо вони не схожі на бойлер, щоб не
          // засмічувати список (телефони/годинники з рандомними MAC).
          if (name.empty() && !looks_like_boiler) {
            return;
          }

          ESP_LOGI("ble_scan", "MAC=%s name='%s' rssi=%d%s",
                   mac.c_str(), name.c_str(), rssi,
                   looks_like_boiler ? "  <-- схоже на бойлер" : "");

          // Екрануємо лапки/бекслеші в імені для коректного JSON.
          std::string jn;
          for (size_t i = 0; i < name.size(); i++) {
            char c = name[i];
            if (c == '"' || c == '\\') jn += '\\';
            if (c >= 0x20) jn += c;
          }

          std::string entry = std::string("{\"mac\":\"") + mac + "\",\"name\":\"" + jn +
              "\",\"boiler\":" + (looks_like_boiler ? "true" : "false") +
              ",\"rssi\":" + to_string(rssi) + "}";

          // Оновлюємо список: якщо MAC уже є — замінюємо запис, інакше додаємо.
          std::string cur = id(ble_scan_json);
          std::string key = std::string("\"mac\":\"") + mac + "\"";
          if (cur.find(key) != std::string::npos) {
            // вже у списку — лишаємо (не дублюємо; свіжий RSSI не критичний)
            id(ble_last_seen).publish_state(mac + (name.empty() ? "" : (" (" + name + ")")));
            return;
          }
          // Вставляємо на початок масиву. cur має вигляд "[...]" або "[]".
          std::string inner = (cur.size() >= 2) ? cur.substr(1, cur.size() - 2) : "";
          std::string joined = inner.empty() ? entry : (entry + "," + inner);
          id(ble_scan_json) = std::string("[") + joined + "]";
          id(ble_last_seen).publish_state(mac + (name.empty() ? "" : (" (" + name + ")"))
              + (looks_like_boiler ? " [boiler?]" : ""));
