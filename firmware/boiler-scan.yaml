# ============================================================================
#  Діагностична прошивка: ПОШУК BLE MAC бойлера
# ============================================================================
#  Призначення: якщо ви не знаєте Bluetooth-адресу бойлера, прошийте це,
#  подивіться лог / вебсторінку — знайдете MAC. Потім впишіть його у
#  secrets.yaml (boiler_ble_mac) і прошийте основний boiler-weact.yaml.
#
#  Ця прошивка НЕ під'єднується до бойлера як клієнт — лише сканує ефір.
#  Переконайтесь, що штатний застосунок Drazice від'єднаний.
# ============================================================================

substitutions:
  device_name: "drazice-scan"
  friendly_name: "Drazice BLE Scan"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  flash_size: 8MB
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret ap_password

web_server:
  port: 80
  version: 3
  local: true
  auth:
    username: !secret web_username
    password: !secret web_password

logger:
  level: INFO
  baud_rate: 115200

packages:
  ble_scan: !include packages/ble_scan.yaml
